<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Enviar alerta · Alerta Vecinos</title><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head>
<body><header class="topbar"><div class="container nav"><a class="brand" href="menu.html"><span class="brand-mark">🚨</span> Alerta Vecinos</a><nav class="nav-links"><a href="menu.html">Menú</a><a href="mapa.html">Mapa</a><a href="alertas.html">Alertas</a><a href="perfil.html">Perfil</a></nav></div></header>
<main class="dashboard"><div class="container"><div class="panel" style="max-width:760px;margin:auto"><span class="eyebrow">🚨 Reportar incidente</span><h1 style="font-size:38px">Enviar una alerta</h1><p class="lead" style="font-size:14px">Selecciona el tipo de incidente y agrega una breve descripción.</p>
<form id="alertForm"><div class="field"><label>Tipo de alerta</label><select id="tipo" required><option value="">Selecciona una categoría</option><option>Robo o intento de robo</option><option>Situación sospechosa</option><option>Accidente</option><option>Emergencia</option><option>Otro</option></select></div>
<div class="field"><label>Descripción</label><textarea id="descripcion" rows="5" placeholder="Describe brevemente lo ocurrido..." required></textarea></div>
<div class="field"><label>Ubicación</label><input id="ubicacion" placeholder="Calle o referencia aproximada" required></div>
<div class="actions"><button class="btn btn-primary" type="submit">🚨 Enviar alerta</button><a class="btn btn-secondary" href="menu.html">Cancelar</a></div></form><p id="mensaje" class="helper"></p>
</div></div></main>
<script>document.getElementById("alertForm").addEventListener("submit",e=>{e.preventDefault();const a={tipo:tipo.value,descripcion:descripcion.value,ubicacion:ubicacion.value,fecha:new Date().toLocaleString()};let arr=JSON.parse(localStorage.getItem("alertas")||"[]");arr.push(a);localStorage.setItem("alertas",JSON.stringify(arr));mensaje.textContent="✓ Alerta enviada correctamente.";mensaje.style.color="#2e7d52";e.target.reset();});</script></body></html>
