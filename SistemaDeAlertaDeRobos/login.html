<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Iniciar sesión · Alerta Vecinos</title><link rel="stylesheet" href="css/estilos.css"></head>
<body><main class="form-page"><div class="form-wrap">
<section class="form-info"><span class="eyebrow" style="background:rgba(255,255,255,.15);color:#fff">🚨 Alerta Vecinos</span><h1 style="font-size:40px">Bienvenido de nuevo.</h1><p>Inicia sesión para acceder al menú principal y a las funciones de la comunidad.</p></section>
<section class="form-box"><h2>Iniciar sesión</h2><p style="color:var(--muted);margin-top:6px">Ingresa tus datos para continuar.</p>
<form id="loginForm">
<div class="field"><label for="correo">Correo electrónico</label><input id="correo" type="email" required placeholder="ejemplo@correo.com"></div>
<div class="field"><label for="contrasena">Contraseña</label><input id="contrasena" type="password" required placeholder="••••••••"></div>
<button class="btn btn-primary" type="submit">Entrar al menú →</button>
</form><p id="mensaje" class="helper"></p><p class="helper">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p><p class="helper"><a href="index.html">← Volver al inicio</a></p>
</section></div></main>
<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
 e.preventDefault();
 const correo=document.getElementById("correo").value.trim().toLowerCase();
 const pass=document.getElementById("contrasena").value;
 let usuarios=JSON.parse(localStorage.getItem("usuarios")||"[]");
 const u=usuarios.find(x=>x.correo.toLowerCase()===correo && x.contrasena===pass);
 if(u){localStorage.setItem("usuarioActual",JSON.stringify(u));window.location.href="menu.html";}
 else{document.getElementById("mensaje").textContent="Correo o contraseña incorrectos.";document.getElementById("mensaje").style.color="var(--vino)";}
});
</script></body></html>
