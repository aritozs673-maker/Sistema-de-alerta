<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Alerta Vecinos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="contenedor centrado">
    <section class="panel-info">
      <div class="logo">AV</div>
      <p class="mini">SISTEMA DE ALERTA COMUNITARIA</p>
      <h1>BIENVENIDO<br><span>DE VUELTA</span></h1>
      <p>Accede a tu cuenta para continuar.</p>
    </section>

    <section class="tarjeta">
      <p class="etiqueta">ACCESO</p>
      <h2>Iniciar sesión</h2>
      <p class="sub">Ingresa tus credenciales.</p>

      <form id="formLogin">
        <label>Correo electrónico</label>
        <input type="email" id="correo" required>

        <label>Contraseña</label>
        <input type="password" id="password" required>

        <button type="submit" class="btn principal ancho">ENTRAR</button>
      </form>

      <p id="mensaje" class="mensaje"></p>
      <p class="pie">¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
