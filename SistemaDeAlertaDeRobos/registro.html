<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Registro · Alerta Vecinos</title><link rel="stylesheet" href="css/estilos.css"></head>
<body><main class="form-page"><div class="form-wrap">
<section class="form-info"><span class="eyebrow" style="background:rgba(255,255,255,.15);color:#fff">🤝 Comunidad</span><h1 style="font-size:40px">Crea tu cuenta.</h1><p>Regístrate para poder utilizar las funciones de alerta y mantenerte informado.</p></section>
<section class="form-box"><h2>Crear cuenta</h2><p style="color:var(--muted);margin-top:6px">Completa tus datos.</p>
<form id="registroForm">
<div class="field"><label>Nombre completo</label><input id="nombre" required placeholder="Tu nombre"></div>
<div class="field"><label>Celular</label><input id="celular" required placeholder="7XXXXXXX"></div>
<div class="field"><label>Correo electrónico</label><input id="correo" type="email" required placeholder="ejemplo@correo.com"></div>
<div class="field"><label>Contraseña</label><input id="contrasena" type="password" minlength="4" required placeholder="Mínimo 4 caracteres"></div>
<button class="btn btn-primary" type="submit">Crear cuenta →</button>
</form><p id="mensaje" class="helper"></p><p class="helper">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p></section>
</div></main>
<script>
document.getElementById("registroForm").addEventListener("submit",function(e){
 e.preventDefault();
 const u={nombre:nombre.value.trim(),celular:celular.value.trim(),correo:correo.value.trim().toLowerCase(),contrasena:contrasena.value};
 let usuarios=JSON.parse(localStorage.getItem("usuarios")||"[]");
 if(usuarios.some(x=>x.correo===u.correo)){mensaje.textContent="Ese correo ya está registrado.";mensaje.style.color="var(--vino)";return;}
 usuarios.push(u);localStorage.setItem("usuarios",JSON.stringify(usuarios));localStorage.setItem("usuarioActual",JSON.stringify(u));
 window.location.href="menu.html";
});
</script></body></html>
