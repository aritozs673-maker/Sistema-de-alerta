<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Alertas cercanas · Alerta Vecinos</title><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head>
<body><header class="topbar"><div class="container nav"><a class="brand" href="menu.html"><span class="brand-mark">🚨</span> Alerta Vecinos</a><nav class="nav-links"><a href="menu.html">Menú</a><a href="mapa.html">Mapa</a><a class="active" href="alertas.html">Alertas</a><a href="perfil.html">Perfil</a></nav></div></header>
<main class="dashboard"><div class="container"><span class="eyebrow">🔔 Comunidad</span><h1 style="font-size:40px">Alertas cercanas</h1><p class="lead" style="font-size:14px">Consulta los reportes registrados en este dispositivo.</p><div id="lista" style="display:grid;gap:14px;margin-top:24px"></div><div class="actions"><a class="btn btn-primary" href="alerta.html">🚨 Crear alerta</a><a class="btn btn-secondary" href="menu.html">← Menú</a></div></div></main>
<script>const lista=document.getElementById("lista"),arr=JSON.parse(localStorage.getItem("alertas")||"[]");if(!arr.length)lista.innerHTML='<div class="panel empty">🔔<br><br>Aún no hay alertas registradas.</div>';else arr.slice().reverse().forEach(a=>{lista.innerHTML+=`<article class="card"><div style="display:flex;justify-content:space-between;gap:10px"><h3>🚨 ${a.tipo}</h3><span class="badge">${a.fecha}</span></div><p>${a.descripcion}</p><p><strong>📍 Ubicación:</strong> ${a.ubicacion}</p></article>`});</script></body></html>
