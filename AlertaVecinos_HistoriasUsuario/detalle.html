<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalle del incidente</title><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="menu.html"><span class="brand-mark">🚨</span>Alerta Vecinos</a><nav class="nav-links"><a href="menu.html">Menú</a><a href="mapa.html">Mapa</a><a href="mis-reportes.html">Mis reportes</a><a href="perfil.html">Perfil</a><a href="mapbox.html">Mapbox</a><a href="#" onclick="logout();return false">Salir</a></nav></div></header><main class="dashboard"><div class="container"><div id="content" class="panel">Cargando...</div></div></main><div id="toast" class="toast"></div><script>
let id=new URLSearchParams(location.search).get('id');
function load(){let i=APP.allIncidents().find(x=>x.id===id);if(!i){content.innerHTML='<div class="empty">Incidente no encontrado.</div>';return}let u=APP.user();content.innerHTML=`<span class="eyebrow">HU-06 · Información detallada · HU-18 · HU-20</span><h1 style="font-size:38px;margin:15px 0">${i.tipo==='Retén policial'?'👮':'🚨'} ${APP.esc(i.tipo)}</h1><div class="meta"><span class="badge">ID: ${i.id}</span><span class="badge">${new Date(i.fecha).toLocaleString()}</span><span class="badge">${i.resolved?'Resuelto':'Activo'}</span></div><div class="field"><label>Descripción</label><p>${APP.esc(i.descripcion)}</p></div><div class="field"><label>Ubicación</label><p>📍 ${APP.esc(i.ubicacion)} ${i.lat!==null?`(${Number(i.lat).toFixed(5)}, ${Number(i.lng).toFixed(5)})`:''}</p></div><div class="field"><label>Reportado por</label><p>${APP.esc(i.userName||'Vecino')}</p></div>${i.evidencia_datos?`<div class="field"><label>Evidencia</label><img src="${i.evidencia_datos}" style="max-width:320px;border-radius:14px"></div>`:''}<div class="notice" style="margin-top:20px">👥 Confirmaciones de vecinos: <strong>${i.confirmados||0}</strong></div><div class="actions"><button class="btn btn-primary" onclick="confirmAlert()">✓ Confirmar alerta</button>${i.userId==u.id&&!i.resolved?`<button class="btn btn-danger" onclick="resolveAlert()">Marcar como resuelto</button>`:''}<a class="btn btn-secondary" href="mapa.html">← Volver al mapa</a></div>`}
async function confirmAlert(){try{await APP.actionIncident(id,'confirmar');APP.toast('✓ Alerta confirmada.');load()}catch(e){APP.toast(e.message)}}async function resolveAlert(){try{await APP.actionIncident(id,'resolver');APP.toast('✓ Incidente marcado como resuelto.');setTimeout(()=>location.href='mis-reportes.html',500)}catch(e){APP.toast(e.message)}}load();
</script></body></html>
