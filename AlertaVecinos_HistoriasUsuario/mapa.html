<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa de incidentes</title><link rel="stylesheet" href="css/estilos.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="js/app.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="menu.html"><span class="brand-mark">🚨</span>Alerta Vecinos</a><nav class="nav-links"><a href="menu.html">Menú</a><a class="active" href="mapa.html">Mapa</a><a href="mis-reportes.html">Mis reportes</a><a href="mapbox.html">Mapbox</a><a href="perfil.html">Perfil</a><a href="#" onclick="logout();return false">Salir</a></nav></div></header><main class="dashboard"><div class="container"><div class="section-head"><div><span class="eyebrow">HU-04 · HU-05 · HU-09 · HU-03</span><h1 style="font-size:40px;margin:12px 0 5px">Mapa de incidentes</h1><p>Los incidentes se guardan localmente y sus coordenadas pueden obtenerse con GPS.</p></div><div class="actions"><a class="btn btn-secondary" href="mapbox.html">⚙ Mapbox</a><button class="btn btn-primary" id="myLocation">📍 Mi ubicación</button></div></div><div class="notice" style="margin-bottom:15px">🗺️ <strong>Mapa:</strong> Leaflet + OpenStreetMap. Funciona desde GitHub Pages mientras tengas conexión a internet.</div><div class="panel"><div id="map" class="map"></div><div class="toolbar"><button class="btn btn-secondary btn-small" onclick="filterMap('all')">Todos</button><button class="btn btn-secondary btn-small" onclick="filterMap('alert')">🚨 Incidentes</button><button class="btn btn-secondary btn-small" onclick="filterMap('police')">👮 Retenes</button><button class="btn btn-secondary btn-small" onclick="filterMap('near')">📍 Cerca de mí</button></div><div id="mapList" class="incident-list"></div></div></div></main><div id="toast" class="toast"></div><script>
let map,markers=[],userPos=null,incidents=[];function init(){incidents=APP.allIncidents();map=L.map('map').setView([-16.499,-68.145],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);render('all')}function markerIcon(i){return i.tipo==='Retén policial'?'👮':'🚨'}function render(filter='all'){markers.forEach(m=>map.removeLayer(m));markers=[];let arr=incidents.filter(i=>i.lat!==null&&i.lng!==null&&!i.resolved);if(filter==='alert')arr=arr.filter(i=>i.tipo!=='Retén policial');if(filter==='police')arr=arr.filter(i=>i.tipo==='Retén policial');if(filter==='near'&&userPos)arr=arr.filter(i=>APP.distance(userPos,{lat:i.lat,lng:i.lng})<=1);arr.forEach(i=>{let m=L.marker([i.lat,i.lng]).addTo(map);m.bindPopup('<b>'+markerIcon(i)+' '+APP.esc(i.tipo)+'</b><br>'+APP.esc(i.ubicacion)+'<br><a href="detalle.html?id='+encodeURIComponent(i.id)+'">Ver detalle →</a>');markers.push(m)});mapList.innerHTML=arr.length?arr.map(i=>`<article class="card incident"><div class="incident-top"><div><h3>${markerIcon(i)} ${APP.esc(i.tipo)}</h3><p>${APP.esc(i.descripcion)}</p></div><span class="badge">${new Date(i.fecha).toLocaleString()}</span></div><div class="meta"><span class="badge">📍 ${APP.esc(i.ubicacion)}</span>${userPos?`<span class="badge">${APP.distance(userPos,{lat:i.lat,lng:i.lng}).toFixed(2)} km</span>`:''}</div><div class="actions"><a class="btn btn-secondary btn-small" href="detalle.html?id=${encodeURIComponent(i.id)}">Consultar información →</a></div></article>`).join(''):'<div class="empty">No hay incidentes para este filtro.</div>'}function filterMap(f){render(f)}myLocation.onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lng:p.coords.longitude};map.setView([userPos.lat,userPos.lng],15);L.circleMarker([userPos.lat,userPos.lng],{radius:9}).addTo(map).bindPopup('📍 Tu ubicación').openPopup();render('all')},()=>APP.toast('No se pudo obtener tu ubicación.'));init();
</script></body></html>
