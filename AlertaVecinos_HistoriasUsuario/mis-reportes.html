<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis reportes</title><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="menu.html"><span class="brand-mark">🚨</span>Alerta Vecinos</a><nav class="nav-links"><a href="menu.html">Menú</a><a href="mapa.html">Mapa</a><a class="active" href="mis-reportes.html">Mis reportes</a><a href="perfil.html">Perfil</a><a href="mapbox.html">Mapbox</a><a href="#" onclick="logout();return false">Salir</a></nav></div></header><main class="dashboard"><div class="container"><div class="section-head"><div><span class="eyebrow">HU-10 · HU-18 · HU-20 · HU-22</span><h1 style="font-size:40px;margin:12px 0 5px">Mis reportes</h1><p>Consulta tus alertas guardadas en este navegador y pendientes sin conexión.</p></div><span id="networkStatus"></span></div><div id="offline" class="notice" style="display:none;margin-bottom:15px"></div><div id="list" class="incident-list"><div class="panel empty">Cargando reportes...</div></div></div></main><div id="toast" class="toast"></div><script>
function render(){let u=APP.user(),arr=APP.allIncidents(),mine=arr.filter(i=>i.userId===u.id),q=APP.queue().filter(i=>i.userId===u.id);offline.style.display=q.length?'block':'none';offline.textContent=q.length?'📦 '+q.length+' alerta(s) guardada(s) sin conexión.':'';if(!mine.length&&!q.length){list.innerHTML="<div class='panel empty'>📋 Aún no tienes reportes.<br><br><a class='btn btn-primary' href='alerta.html'>Crear alerta</a></div>";return}list.innerHTML=[...mine.map(i=>`<article class="panel incident ${i.resolved?'resolved':''}"><div class="incident-top"><div><h3>${i.tipo==='Retén policial'?'👮':'🚨'} ${APP.esc(i.tipo)}</h3><p>${APP.esc(i.descripcion)}</p></div><span class="badge">${i.resolved?'Resuelto':'Activo'}</span></div><div class="meta"><span class="badge">📍 ${APP.esc(i.ubicacion)}</span><span class="badge">✓ ${i.confirmados||0} confirmaciones</span><span class="badge">${new Date(i.fecha).toLocaleString()}</span></div><div class="actions"><a class="btn btn-secondary btn-small" href="detalle.html?id=${encodeURIComponent(i.id)}">Ver detalle</a>${!i.resolved?`<button class="btn btn-danger btn-small" onclick="resolve('${i.id}')">Marcar resuelto</button>`:''}</div></article>`),...q.map(i=>`<article class="panel incident"><h3>📦 ${APP.esc(i.tipo)} <span class="badge">Pendiente</span></h3><p>${APP.esc(i.descripcion)}</p></article>`)].join('')}
async function resolve(id){try{await APP.actionIncident(id,'resolver');APP.toast('✓ Incidente marcado como resuelto.');render()}catch(e){APP.toast(e.message)}}render();
</script></body></html>
