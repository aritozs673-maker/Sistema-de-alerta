<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro</title><link rel="stylesheet" href="css/estilos.css"></head><body><main class="form-page"><div class="form-wrap"><section class="form-info"><span class="eyebrow" style="background:rgba(255,255,255,.15);color:#fff">HU-01 · Registro</span><h1 style="font-size:40px">Únete a la comunidad.</h1><p>Crea tu cuenta para reportar y consultar incidentes.</p></section><section class="form-box"><h2>Crear cuenta</h2><form id="f"><div class="field"><label>Nombre completo</label><input id="nombre" required></div><div class="field"><label>Celular</label><input id="celular" required></div><div class="field"><label>Correo</label><input id="correo" type="email" required></div><div class="field"><label>Contraseña</label><input id="pass" type="password" minlength="4" required></div><button class="btn btn-primary" style="width:100%;margin-top:20px">Crear cuenta</button></form><div id="msg"></div><p class="helper">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p></section></div></main><script src="js/app.js"></script><script>
f.addEventListener('submit',async e=>{e.preventDefault();try{await APP.register({nombre:nombre.value.trim(),celular:celular.value.trim(),correo:correo.value.trim().toLowerCase(),contrasena:pass.value});location.href='menu.html'}catch(err){msg.className='message error';msg.textContent=err.message}});
</script></body></html>
