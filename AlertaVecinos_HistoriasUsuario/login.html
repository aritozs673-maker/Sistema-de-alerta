<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión</title><link rel="stylesheet" href="css/estilos.css"></head><body><main class="form-page"><div class="form-wrap"><section class="form-info"><span class="eyebrow" style="background:rgba(255,255,255,.15);color:#fff">HU-11 · HU-12 · Acceso</span><h1 style="font-size:40px">Bienvenido de nuevo.</h1><p>Ingresa a tu cuenta para gestionar alertas e incidentes.</p></section><section class="form-box"><h2>Iniciar sesión</h2><form id="f"><div class="field"><label>Correo</label><input id="correo" type="email" required></div><div class="field"><label>Contraseña</label><input id="pass" type="password" required></div><button class="btn btn-primary" style="width:100%;margin-top:20px">Entrar →</button></form><div id="msg"></div><p class="helper">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p></section></div></main><script src="js/app.js"></script><script>
f.addEventListener('submit',async e=>{e.preventDefault();try{await APP.login(correo.value.trim().toLowerCase(),pass.value);location.href='menu.html'}catch(err){msg.className='message error';msg.textContent=err.message}});
</script></body></html>
