<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alertas cercanas</title><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="menu.html"><span class="brand-mark">🚨</span>Alerta Vecinos</a><nav class="nav-links"><a href="menu.html">Menú</a><a href="mapa.html">Mapa</a><a class="active" href="alertas.html">Cercanía</a><a href="mis-reportes.html">Mis reportes</a><a href="perfil.html">Perfil</a><a href="#" onclick="logout();return false">Salir</a></nav></div></header><main class="dashboard"><div class="container"><div class="section-head"><div><span class="eyebrow">HU-05 · Alertas por cercanía</span><h1 style="font-size:40px;margin:12px 0 5px">Alertas cercanas</h1><p>Localiza tu posición y muestra incidentes activos a menos de 1 km.</p></div><button id="gps" class="btn btn-primary">📍 Detectar mi ubicación</button></div><div id="msg" class="notice">Primero detecta tu ubicación para calcular distancias.</div><div id="list" class="incident-list"></div></div></main><div id="toast" class="toast"></div><script>
let pos=null;gps.onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};msg.textContent='✓ Ubicación detectada. Mostrando incidentes a menos de 1 km.';render()},()=>msg.textContent='No se pudo obtener tu ubicación.');function render(){let all=APP.allIncidents();let arr=all.filter(i=>i.lat!==null&&i.lng!==null&&!i.resolved&&APP.distance(pos,{lat:i.lat,lng:i.lng})<=1);list.innerHTML=arr.length?arr.map(i=>`<article class="panel incident near"><div class="incident-top"><h3>${i.tipo==='Retén policial'?'👮':'🚨'} ${APP.esc(i.tipo)}</h3><span class="badge">${APP.distance(pos,{lat:i.lat,lng:i.lng}).toFixed(2)} km</span></div><p>${APP.esc(i.descripcion)}</p><div class="actions"><a class="btn btn-secondary btn-small" href="detalle.html?id=${encodeURIComponent(i.id)}">Ver detalle →</a></div></article>`).join(''):'<div class="panel empty">🔔 No hay alertas activas a menos de 1 km de tu ubicación.</div>'}
</script></body></html>
