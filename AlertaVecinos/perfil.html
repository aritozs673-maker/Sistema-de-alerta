<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil</title><link rel="stylesheet" href="css/estilos.css"><script src="js/app.js"></script></head><body><header class="topbar"><div class="container nav"><a class="brand" href="menu.html"><span class="brand-mark">🚨</span>Alerta Vecinos</a><nav class="nav-links"><a href="menu.html">Menú</a><a href="mapa.html">Mapa</a><a href="mis-reportes.html">Mis reportes</a><a class="active" href="perfil.html">Perfil</a><a href="#" onclick="logout();return false">Salir</a></nav></div></header><main class="dashboard"><div class="container"><div class="profile-grid"><aside class="panel profile-side"><div id="avatar" class="avatar">AV</div><h2 data-user>Vecino</h2><p style="color:var(--muted)">Usuario registrado</p><div class="stats"><div class="stat"><strong id="count">0</strong><small>Reportes</small></div><div class="stat"><strong>✓</strong><small>Cuenta</small></div><div class="stat"><strong id="confirmed">0</strong><small>Confirmaciones</small></div></div></aside><section class="panel"><span class="eyebrow">HU-13 · Editar perfil</span><h1 style="font-size:34px;margin:15px 0">Información de cuenta</h1><form id="f"><div class="field"><label>Nombre completo</label><input id="nombre" required></div><div class="field"><label>Celular</label><input id="celular" required></div><div class="field"><label>Correo</label><input id="correo" type="email" disabled></div><button class="btn btn-primary" style="margin-top:20px">Guardar cambios</button></form><div id="msg"></div></section></div></div></main><div id="toast" class="toast"></div><script>
let u=APP.user();nombre.value=u.nombre;celular.value=u.celular;correo.value=u.correo;avatar.textContent=u.nombre.split(" ").slice(0,2).map(x=>x[0]).join("").toUpperCase();
APP.incidents().then(a=>{count.textContent=a.filter(i=>i.userId==u.id).length;confirmed.textContent=a.filter(i=>false).length}).catch(()=>{});
f.addEventListener('submit',async e=>{e.preventDefault();try{u=await APP.saveProfile({nombre:nombre.value.trim(),celular:celular.value.trim(),lat:u.lat,lng:u.lng});avatar.textContent=u.nombre.split(" ").slice(0,2).map(x=>x[0]).join("").toUpperCase();document.querySelectorAll('[data-user]').forEach(x=>x.textContent=u.nombre);msg.className='message success';msg.textContent='✓ Perfil actualizado correctamente en MySQL.'}catch(err){msg.className='message error';msg.textContent=err.message}});
</script></body></html>
